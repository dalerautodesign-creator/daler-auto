<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daler Auto Design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,700;1,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--b:#0069b3;--b2:#004d85;--bg:#eef3f8;--card:#fff;--tx:#17202b;--mut:#66758a;--ln:#dde5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--card:#17212c;--tx:#eaf0f7;--mut:#8fa0b3;--ln:#263443;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d141c;--card:#17212c;--tx:#eaf0f7;--mut:#8fa0b3;--ln:#263443;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
body{max-width:480px;margin:0 auto;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--b);z-index:30}
h1,h2,h3,.dsp{font-family:"Exo 2",Inter,sans-serif;font-style:italic;font-weight:800;margin:0}
button,input,a{font:inherit}button{cursor:pointer;border:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--b);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;height:58px}
header img{height:42px;border-radius:8px}
header .t{flex:1;font-size:19px}
.ib{background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;border-radius:12px;font-size:19px;position:relative;transition:transform .15s}
.ib:active{transform:scale(.9)}
.bump{animation:bump .4s}@keyframes bump{40%{transform:scale(1.25)}}
.cnt{position:absolute;top:-4px;right:-4px;background:#fff;color:var(--b);font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;line-height:18px}
main{padding:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{font-size:20px}.sec a{color:var(--b);font-weight:600;font-size:13px}
.srch,.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.inp{margin-top:10px}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:14px -14px 0;padding:0 14px}
.car::-webkit-scrollbar{display:none}
.bn{flex:0 0 90%;scroll-snap-align:center;border-radius:22px;padding:18px;min-height:170px;color:#fff;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center}
.bn .bt{width:58%;position:relative;z-index:1}
.bn h3{font-size:23px;line-height:1.08}.bn p{margin:6px 0 12px;font-size:13px;opacity:.93}
.go{background:#fff;color:var(--b2);padding:8px 16px;border-radius:20px;font-weight:600;font-size:13px;display:inline-block}
.bn img{position:absolute;right:10px;top:14px;bottom:14px;width:38%;object-fit:cover;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.bn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);animation:sh 4.5s infinite}
@keyframes sh{to{left:130%}}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ln);transition:.3s}.dots i.on{width:20px;background:var(--b)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .15s}
.pc:active{transform:scale(.97)}
.pi{height:140px;border-radius:13px;background:#fff;overflow:hidden;position:relative}
.pi img{width:100%;height:100%;object-fit:cover}
.bd{position:absolute;top:8px;left:8px;background:var(--b);color:#fff;font-size:11px;padding:3px 9px;border-radius:9px;font-family:"Exo 2",sans-serif;font-style:italic}
.pn{font-weight:600;font-size:14px;line-height:1.25}
.pp{font-weight:700;color:var(--b);font-size:16px}.pp small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.ad{background:var(--bg);color:var(--b);border-radius:11px;padding:9px;font-weight:600;font-size:13px}
.cc{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;cursor:pointer;font-weight:600;text-align:center;padding-bottom:12px}
.cc img{width:100%;height:110px;object-fit:cover;display:block;margin-bottom:8px}
.cb{display:flex;align-items:center;border-radius:20px;padding:16px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden;cursor:pointer;min-height:130px}
.cb div{width:58%}.cb h3{font-size:21px;line-height:1.1}.cb small{display:block;opacity:.92;margin-top:4px}
.cb img{position:absolute;right:10px;top:12px;bottom:12px;width:34%;object-fit:cover;border-radius:14px}
.hero{border-radius:22px;padding:18px;color:#fff;margin-bottom:14px}
.hero h1{font-size:27px;line-height:1.05}.hero p{margin:8px 0 0}
.hero img{width:100%;border-radius:16px;margin-top:12px;display:block}
.feat{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.feat span{background:rgba(255,255,255,.2);padding:5px 11px;border-radius:14px;font-size:12.5px;font-weight:600}
.pimg{border-radius:22px;overflow:hidden;background:#fff;border:1px solid var(--ln)}.pimg img{width:100%;display:block;max-height:340px;object-fit:cover}
.lb{margin:16px 0 8px;font-weight:600}
.sw,.opts{display:flex;flex-wrap:wrap;gap:8px}
.swb,.ob{background:var(--card);border:1.5px solid var(--ln);color:var(--tx);border-radius:12px;padding:9px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;transition:.2s}
.swb i{width:16px;height:16px;border-radius:50%;background:var(--c);border:1px solid #8884}
.swb.on,.ob.on{border-color:var(--b);background:rgba(0,105,179,.1);color:var(--b)}
.ob{flex:1 1 45%;flex-direction:column;align-items:flex-start;gap:2px}.ob b{font-size:16px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px;margin-bottom:10px}
.row .ri{font-size:26px;width:54px;height:54px;display:grid;place-items:center;border-radius:12px;background:var(--bg);flex:none;overflow:hidden}
.row .ri img{width:100%;height:100%;object-fit:cover}.row .in{flex:1;min-width:0}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:9px;background:var(--bg);color:var(--tx);font-size:16px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;background:linear-gradient(135deg,#0a82d9,#004d85);color:#fff;padding:15px;border-radius:16px;font-weight:700;font-size:16px;margin-top:12px;box-shadow:0 8px 18px rgba(0,105,179,.32);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--card);color:var(--b);border:1.5px solid var(--b);box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#25c260,#168a45);box-shadow:0 8px 18px rgba(31,168,85,.3)}
.btn.sm{padding:11px;font-size:14px;margin-top:8px}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;border:1px solid var(--ln)}
.tabs button{flex:1;padding:10px;border-radius:10px;background:none;color:var(--mut);font-weight:600}.tabs button.on{background:var(--b);color:#fff}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#0a82d9,#004d85);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 8px}
.tl{margin:10px 0 4px;padding-left:6px}.tl div{position:relative;padding:0 0 16px 26px;color:var(--mut);font-size:14px}
.tl div::before{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;background:var(--ln)}
.tl div::after{content:"";position:absolute;left:6px;top:18px;bottom:0;width:2px;background:var(--ln)}.tl div:last-child::after{display:none}
.tl .dn{color:var(--tx);font-weight:600}.tl .dn::before{background:var(--b);animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(0,105,179,.2)}}
.cardp{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#0a82d9,#00305a 70%,#5a5a5a);min-height:170px;position:relative;overflow:hidden;box-shadow:0 12px 24px rgba(0,48,90,.35);margin-bottom:6px}
.cardp .br{display:flex;justify-content:space-between;font-family:"Exo 2",sans-serif;font-style:italic;font-weight:800}
.cardp .no{font-size:20px;letter-spacing:2px;margin:26px 0 14px;font-variant-numeric:tabular-nums}
.cardp .ft{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
.cardp::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);animation:sh 5s infinite}
.two{display:flex;gap:10px}.two .inp{flex:1}
.rad{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--ln);background:var(--card);border-radius:14px;margin-bottom:8px;cursor:pointer}
.rad.on{border-color:var(--b);background:rgba(0,105,179,.08)}
.rad i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);flex:none}.rad.on i{border:5px solid var(--b)}
.note{color:var(--mut);font-size:12.5px;margin-top:8px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;background:none;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px;border-radius:12px}
nav button span{font-size:21px;transition:transform .25s}nav button.on{color:var(--b)}nav button.on span{transform:translateY(-3px) scale(1.18)}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#17202b;color:#fff;padding:10px 18px;border-radius:22px;opacity:0;transition:.3s;z-index:60;font-size:14px;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#sp{position:fixed;inset:0;background:var(--b);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;clip-path:inset(0 0 0 0);transition:clip-path .85s cubic-bezier(.7,0,.3,1)}
#sp.out{clip-path:inset(0 0 0 100%)}
#sp img{width:230px;border-radius:24px;animation:pop 1s cubic-bezier(.2,1.3,.4,1) both}
.rd{width:264px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);position:relative}
.rd .fl{height:100%;border-radius:3px;background:#fff;animation:ld 2.3s cubic-bezier(.5,0,.4,1) forwards}
.rd svg{position:absolute;left:0;bottom:5px;width:84px;animation:dr 2.3s cubic-bezier(.5,0,.4,1) forwards}
#sp small{color:#fff;opacity:.85;font-family:"Exo 2",sans-serif;font-style:italic;font-weight:700;letter-spacing:1px}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
@keyframes ld{from{width:0}to{width:100%}}
@keyframes dr{from{transform:translateX(0)}to{transform:translateX(180px)}}
.ok{font-size:70px;animation:pop .7s cubic-bezier(.2,1.3,.4,1) both;text-align:center}
.empty{text-align:center;color:var(--mut);padding:40px 10px}.empty span{font-size:52px;display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cta{border-radius:22px;padding:18px;margin-top:16px;color:#fff;background:linear-gradient(135deg,#0d2a45,#0069b3);position:relative;overflow:hidden}
.cta h3{font-size:21px}.cta p{margin:6px 0 12px;opacity:.92;font-size:13.5px;max-width:82%}
.cta .go{border:0;cursor:pointer}.cta::before{content:"🛠️";position:absolute;right:14px;top:10px;font-size:54px;opacity:.9}
.stp{display:flex;margin-bottom:20px}.stp div{flex:1;text-align:center;position:relative;color:var(--mut);font-size:11px;font-weight:600}
.stp div::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--ln)}.stp div:first-child::before{display:none}
.stp b{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--card);border:2px solid var(--ln);display:grid;place-items:center;margin:0 auto 4px;font-size:13px;transition:.3s}
.stp .on{color:var(--b)}.stp .on b{border-color:var(--b);color:var(--b);box-shadow:0 0 0 5px rgba(0,105,179,.15)}
.stp .dn{color:var(--tx)}.stp .dn b{background:var(--b);border-color:var(--b);color:#fff}.stp .dn::before,.stp .on::before{background:var(--b)}
.dc{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -14px 0;padding:0 14px}.dc::-webkit-scrollbar{display:none}
.dc button{flex:0 0 auto;width:62px;padding:8px 0;border-radius:14px;background:var(--card);border:1.5px solid var(--ln);color:var(--tx);display:flex;flex-direction:column;align-items:center;transition:.2s}
.dc button b{font-size:20px;font-family:"Exo 2",sans-serif}.dc small{color:var(--mut);font-size:11px}.dc .on{background:var(--b);border-color:var(--b);color:#fff}.dc .on small{color:#fff}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tg button{padding:11px 0;border-radius:12px;background:var(--card);border:1.5px solid var(--ln);color:var(--tx);font-weight:600;transition:.2s}
.tg .on{background:var(--b);border-color:var(--b);color:#fff}.tg button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.ck{stroke-dasharray:60;stroke-dashoffset:60;animation:dk .7s .3s forwards}@keyframes dk{to{stroke-dashoffset:0}}
.ckw{text-align:center;margin:10px 0}
.sum{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:14px}.sum:last-child{border:0}.sum span{color:var(--mut)}.sum b{text-align:right}
.md{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fi .25s}
.mb{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .3s}
.mb p{color:var(--mut);margin:8px 0 6px}.mi{font-size:42px}.gx{background:none;color:var(--mut);padding:12px;width:100%;margin-top:4px}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(60px)}}
.av{position:relative;cursor:pointer}.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.cam{position:absolute;right:-2px;bottom:-2px;background:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px;border:2px solid var(--b);font-style:normal}
.cta.g{background:linear-gradient(135deg,#222,#0069b3)}.cta.g::before{content:"🎁"}
.shk{text-align:center;padding:14px 0}.shk h2{font-size:24px;margin:8px 0}.shk p{color:var(--mut);margin:6px 0}
.ph{font-size:96px;display:inline-block;transform-origin:50% 90%}.ph.arm{animation:shk .5s infinite}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) translateX(-8px)}75%{transform:rotate(14deg) translateX(8px)}}
.pb{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin:16px 6px}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a82d9,#25c260);transition:width .2s}
.tk{display:flex;align-items:center;border:2px dashed var(--b);border-radius:16px;background:var(--card);margin:12px 0;overflow:hidden;text-align:left}
.tk .am{background:var(--b);color:#fff;padding:20px 14px;font-family:"Exo 2",sans-serif;font-style:italic;font-weight:800;font-size:24px;text-align:center;min-width:92px}
.tk .tx{padding:10px 14px;flex:1;font-size:13px}.tk.off{opacity:.5;border-color:var(--ln)}
</style>
</head>

<main id="main"></main>
<nav id="nav"></nav>

const o={id:1000+S.orders.length+1,date:new Date().toLocaleDateString('tr-TR'),si:0,items,total,dc,addr:{...a},pay:PAY.m=='card'?cd.brand+' •••• '+cd.last4:'Havale / EFT'};
const r=await PAYMENT.charge(o);if(!r.ok)return toast(r.msg||'Ödeme alınamadı');
if(dc&&CP){const c=S.coupons.find(x=>x.code==CP);if(c)c.used=true}CP=null;S.orders.push(o);S.cart={};save();upd();stack=[['done',o]];draw()}
function waOrder(){const o=window.LO;window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('Merhaba, Daler Auto Design siparişim #'+o.id+'\n'+o.items.map(i=>i.q+'x '+i.n).join('\n')+'\nToplam: '+TL(o.total)),'_blank')}
const SH={day:5,test:true,p250:.15,p100:.25}; // test:true => her gün ve sınırsız oynanır; yayına almadan önce false yapın
let CP=null,SHR=null,SHB=false,hits=0,lx=0,ly=0,lz=0,lt=0;
const wkKey=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return dk(d)};
const nextFri=()=>{const d=new Date(),i=(SH.day-d.getDay()+7)%7||7;d.setDate(d.getDate()+i);return fd(dk(d))};
const actC=()=>S.coupons.filter(c=>!c.used&&c.exp>Date.now());
const cdisc=t=>{const c=actC().find(x=>x.code==CP);return c?Math.min(c.amt,t):0};
function couponBlock(){const l=actC();if(!l.length)return '';return `<h3 style="font-size:19px;margin-top:22px">Kuponlarım</h3><div style="margin-top:10px"><div class="rad ${CP?'':'on'}" onclick="CP=null;draw(1)"><i></i><b>Kupon kullanma</b></div>${l.map(c=>`<div class="rad ${CP==c.code?'on':''}" onclick="CP='${c.code}';draw(1)"><i></i><div><b>${c.amt} ₺ indirim kuponu</b><div class="note" style="margin:0">${c.code}</div></div></div>`).join('')}</div>`}
function gate(w){if(S.user)return true;const m=document.createElement('div');m.id='md';m.className='md';const n=w=='appt'?'Randevu':'Alışveriş';m.innerHTML=`<div class="mb"><div class="mi">🔒</div><h3 class="dsp" style="font-size:21px">Önce hesabınızı oluşturalım</h3><p>${n} işlemleri için üye olmanız gerekiyor. Ücretsiz üyelik yalnızca birkaç saniye sürer.</p><button class="btn" onclick="gateGo('up')">Kayıt ol</button><button class="btn alt" onclick="gateGo('in')">Zaten üyeyim, giriş yap</button><button class="gx" onclick="gateGo()">Şimdi değil</button></div>`;document.body.appendChild(m);return false}
function gateGo(m){const e=$('#md');if(e)e.remove();if(m){authMode=m;tab('acct')}}
function setPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);S.user.photo=c.toDataURL('image/jpeg',.82);if(S.users[S.user.tel])S.users[S.user.tel].photo=S.user.photo;save();draw(1);toast('Profil fotoğrafı güncellendi')};im.src=r.result};r.readAsDataURL(f)}
async function startShake(){if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){try{const r=await DeviceMotionEvent.requestPermission();if(r!='granted')return toast('Sensör izni verilmedi. Dokunarak da oynayabilirsiniz.')}catch(e){}}
hits=0;SHB=false;window.removeEventListener('devicemotion',onMotion);window.addEventListener('devicemotion',onMotion);const p=$('#phn');if(p)p.classList.add('arm');toast('Şimdi sallayın!')}
function onMotion(e){if(stack[stack.length-1][0]!='shake'||SHR)return;const a=e.accelerationIncludingGravity;if(!a)return;const d=Math.abs(a.x-lx)+Math.abs(a.y-ly)+Math.abs(a.z-lz);lx=a.x;ly=a.y;lz=a.z;const n=Date.now();if(d>25&&n-lt>150){lt=n;hit()}}
function hit(){if(SHB||SHR)return;hits++;const b=$('#sbar'),p=$('#phn');if(p)p.classList.add('arm');if(b)b.style.width=Math.min(100,hits*20)+'%';if(hits>=5){SHB=true;setTimeout(finishShake,350)}}
function finishShake(){window.removeEventListener('devicemotion',onMotion);const r=Math.random(),amt=r<SH.p250?250:r<SH.p250+SH.p100?100:0;let code=null;
if(!SH.test)S.shakeWk=wkKey();if(amt){code='DALER'+amt+'-'+Math.random().toString(36).slice(2,6).toUpperCase();S.coupons.push({code,amt,exp:Date.now()+7*864e5,used:false})}
SHR={amt,code};save();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}draw()}
const WORK={start:9,end:18,off:[0]}; // çalışma saatleri ve tatil günleri (0=Pazar)
const SVC=[{k:'Koltuk kılıfı montajı',i:'💺',d:'Koltuk kılıfınızın araca özel montajı'},{k:'Tavan döşeme',i:'🚘',d:'Tavan döşeme yenileme ve onarım'},{k:'Kolçak montajı',i:'🛋️',d:'Kolçak kılıfı ve yastığı montajı'},{k:'Diğer döşeme işlemleri',i:'🛠️',d:'Detayları not alanında belirtebilirsiniz'}];
let AP={step:0,svc:[],mk:'',md:'',yil:'',date:null,time:null,ad:'',tel:'',not:''};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=k=>new Date(k+'T12:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
function apDays(){const o=[],n=new Date();for(let i=0;o.length<14&&i<30;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(WORK.off.includes(d.getDay()))continue;if(i==0&&n.getHours()>=WORK.end-1)continue;o.push({k:dk(d),w:d.toLocaleDateString('tr-TR',{weekday:'short'}),n:d.getDate(),m:d.toLocaleDateString('tr-TR',{month:'short'})})}return o}
function apSlots(){const bk=S.appts.filter(a=>a.date==AP.date&&a.st!='İptal').map(a=>a.time),n=new Date(),today=AP.date==dk(n),o=[];for(let h=WORK.start;h<WORK.end;h++){const t=String(h).padStart(2,'0')+':00';o.push({t,x:bk.includes(t)||(today&&h<=n.getHours())})}return o}
function apSum(a){const sv=a.svc.map(i=>typeof i=='number'?SVC[i].k:i).join(', ');return `<div class="sum"><span>İşlem</span><b>${sv}</b></div><div class="sum"><span>Araç</span><b>${esc(a.mk)} ${esc(a.md)}${a.yil?' · '+esc(a.yil):''}</b></div><div class="sum"><span>Tarih ve saat</span><b>${fd(a.date)} · ${a.time}</b></div><div class="sum"><span>İletişim</span><b>${esc(a.ad)}<br>${esc(a.tel)}</b></div>${a.not?`<div class="sum"><span>Not</span><b>${esc(a.not)}</b></div>`:''}<div class="sum"><span>Adres</span><b>${ADR}</b></div>`}
function startAppt(pre){if(!gate('appt'))return;AP={step:0,svc:pre==null?[]:[pre],mk:'',md:'',yil:'',date:null,time:null,ad:S.user?S.user.ad:'',tel:S.user?S.user.tel:'',not:''};go('appt')}
function apSvc(i){const x=AP.svc.indexOf(i);x<0?AP.svc.push(i):AP.svc.splice(x,1);draw(1)}
function apDate(k){AP.date=k;AP.time=null;draw(1)}
function apTime(t){AP.time=t;draw(1)}
function apPrev(){if(AP.step>0){AP.step--;draw()}}
function apNext(){const s=AP.step;
if(s==0&&!AP.svc.length)return toast('Lütfen en az bir işlem seçin');
if(s==1&&(!AP.mk.trim()||!AP.md.trim()))return toast('Lütfen araç marka ve modelini girin');
if(s==2&&(!AP.date||!AP.time))return toast('Lütfen bir gün ve saat seçin');
if(s==3&&(!AP.ad.trim()||AP.tel.replace(/\D/g,'').length<10))return toast('Ad soyad ve geçerli bir telefon girin');
if(s<4){AP.step++;return draw()}
if(S.appts.some(a=>a.date==AP.date&&a.time==AP.time&&a.st!='İptal')){AP.step=2;AP.time=null;draw();return toast('Bu saat doldu, lütfen başka bir saat seçin')}
const a={id:'RDV-'+(2001+S.appts.length),svc:AP.svc.map(i=>SVC[i].k),mk:AP.mk.trim(),md:AP.md.trim(),yil:AP.yil.trim(),date:AP.date,time:AP.time,ad:AP.ad.trim(),tel:AP.tel.trim(),not:AP.not.trim(),st:'Talep alındı'};
S.appts.push(a);save();stack=[['apptdone',a]];draw()}
function cancelAppt(id){const a=S.appts.find(x=>x.id==id);if(a){a.st='İptal';save();draw(1);toast('Randevu iptal edildi')}}
function waAppt(){const a=window.LA;window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('Merhaba, Daler Auto Design randevu talebim:\nKod: '+a.id+'\nİşlem: '+a.svc.join(', ')+'\nAraç: '+a.mk+' '+a.md+' '+a.yil+'\nTarih: '+fd(a.date)+' '+a.time+'\nAd: '+a.ad+' · '+a.tel),'_blank')}
upd();draw();
setInterval(()=>{const c=$('#car');if(c&&!document.hidden&&stack.length==1&&stack[0][0]=='home'){slide=(slide+1)%CAMPS.length;c.scrollTo({left:slide*(c.firstChild.offsetWidth+12),behavior:'smooth'})}},4200);
setTimeout(()=>{$('#sp').classList.add('out');setTimeout(()=>$('#sp').style.display='none',900)},2600);
</script>
