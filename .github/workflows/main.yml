
name: DalerAuto Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capacitor paketlerini kur
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Capacitor yapılandırmasını oluştur
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.daler.autodesign",
            "appName": "DalerAuto",
            "webDir": "www",
            "server": {
              "url": "http://dalerauto.nfy.fyi/?i=1",
              "cleartext": true,
              "androidScheme": "http"
            }
          }
          EOF

      - name: Web klasörünü hazırla
        run: |
          mkdir -p www
          echo '<html><body>DalerAuto</body></html>' > www/index.html

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      - name: APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: DalerAuto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
