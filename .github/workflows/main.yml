
name: DalerAuto Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capacitor paketlerini kur
        run: npm install

      - name: Web klasörünü hazırla
        run: |
          mkdir -p www
          echo '<html><body>DalerAuto</body></html>' > www/index.html

      - name: Capacitor yapılandırmasını oluştur
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.daler.autodesign",
            "appName": "DalerAuto",
            "webDir": "www",
            "backgroundColor": "#0069b3",
            "server": {
              "url": "http://dalerauto.nfy.fyi/?i=1",
              "cleartext": true,
              "androidScheme": "http"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Yapılandırmayı doğrula
        run: |
          echo "Proje dizini:"
          pwd
          echo "Dosyalar:"
          ls -la
          echo "Capacitor yapılandırması:"
          cat capacitor.config.json
          node -e "const c=require('./capacitor.config.json'); if(!c.appId) process.exit(1); console.log('App ID:',c.appId)"

      - name: Capacitor sürümünü kontrol et
        run: npx cap --version

      - name: Android projesini oluştur
        run: npx cap add android --config capacitor.config.json

      - name: Capacitor senkronizasyonu
        run: npx cap sync android --config capacitor.config.json

      - name: APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: DalerAuto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
